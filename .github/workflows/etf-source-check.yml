name: ETF source check

on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-snapshots:
    name: KODEX and TIGER official snapshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect official ETF snapshots
        run: >-
          python -m app.cli.check_etf_sources --update
          --output "${RUNNER_TEMP}/etf_official_snapshots.json"

      - name: Upload reviewable snapshot candidate
        uses: actions/upload-artifact@v4
        with:
          name: etf-official-snapshots-${{ github.run_id }}
          path: ${{ runner.temp }}/etf_official_snapshots.json
          if-no-files-found: error
          retention-days: 14

      - name: Require the repository snapshot to be current
        run: |
          if ! cmp -s app/data/etf_official_snapshots.json "${RUNNER_TEMP}/etf_official_snapshots.json"; then
            echo "Official ETF data changed. Review the uploaded candidate artifact."
            exit 1
          fi
