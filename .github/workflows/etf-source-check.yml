name: ETF source check

on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-snapshots:
    name: KODEX and TIGER official snapshots
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compare official ETF snapshots
        run: python -m app.cli.check_etf_sources --check
