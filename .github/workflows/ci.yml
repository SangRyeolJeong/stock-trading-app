name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate production configuration
        env:
          APP_ENV: production
          AUTH_MODE: supabase
          DATABASE_URL: postgresql+asyncpg://moa:ci-placeholder@database:5432/moa
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          CORS_ORIGINS: https://app.example.com
          MARKET_DATA_PROVIDER: mock
        run: python -m app.cli.deployment_preflight --config-only

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check app tests

  postgres:
    name: PostgreSQL runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AUTH_MODE: demo
      DATABASE_URL: postgresql+asyncpg://moa:moa-ci@127.0.0.1:5432/moa_ci
      MARKET_DATA_PROVIDER: mock
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moa_ci
          POSTGRES_USER: moa
          POSTGRES_PASSWORD: moa-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moa -d moa_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run PostgreSQL locking and invariant tests
        env:
          MOA_TEST_DATABASE: postgresql
        run: python -m pytest tests/postgres -vv

      - name: Check production deployment preflight
        env:
          APP_ENV: production
          AUTH_MODE: supabase
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          CORS_ORIGINS: https://app.example.com
        run: python -m app.cli.deployment_preflight

      - name: Check API readiness, account and preferences bootstrap
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/moa-postgres-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/moa-postgres-api.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/v1/paper/accounts
          curl --fail --silent --show-error \
            --request PUT \
            --header "Content-Type: application/json" \
            --data '{
              "display_name": "CI 사용자",
              "annual_salary_krw": 45000000,
              "monthly_investment_krw": 500000,
              "investment_years": 30,
              "annual_return_rate_pct": 7,
              "withdrawal_age": 60,
              "strategy_goal": "retirement",
              "risk_profile": "growth",
              "liquidity_preference": true,
              "fee_sensitivity": true,
              "income_preference": false
            }' \
            http://127.0.0.1:8000/api/v1/me/preferences
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/v1/me/preferences

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  containers:
    name: Containers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build application images
        run: docker compose build backend frontend
